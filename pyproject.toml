[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clockify-python-115"
version = "0.1.0"
description = "Complete async Clockify SDK and MCP server for Python"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]
keywords = ["clockify", "time-tracking", "mcp", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.optional-dependencies]
mcp = ["mcp>=2.0.0"]

[project.scripts]
clockify-mcp = "clockify_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/clockify", "src/clockify_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "SECURITY.md"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "SIM108",  # ternary is not always clearer
    "E501",    # generated model docstrings may exceed line length; format handles code
]

[tool.pyright]
pythonVersion = "3.11"
include = ["src", "tests", "scripts"]
typeCheckingMode = "strict"
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: tests that hit the real Clockify API (excluded from ordinary runs)",
]
addopts = "-ra"
