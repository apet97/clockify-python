name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

defaults:
  run:
    working-directory: 2mcp

env:
  UV_VERSION: "0.11.32"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: 2mcp
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: apet97/clockify-ts-sdk
          ref: d7091a44a1b95d4918fa17a7f9b174bf668a9136
          path: clockify-ts-sdk
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
      - run: uv sync --locked --all-extras --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest -q -m "not live"
      - run: uv build
      - run: >-
          uv run python scripts/verify_artifact.py
          --wheel dist/clockify_python_115-0.1.0-py3-none-any.whl
          --sdist dist/clockify_python_115-0.1.0.tar.gz
          --python 3.11
      - run: >-
          uv run python scripts/verify_artifact.py
          --wheel dist/clockify_python_115-0.1.0-py3-none-any.whl
          --python 3.14
      - run: shasum -a 256 dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: 2mcp/dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@6733eb7d741f0b11ec6a39b58540dab7590f9b7d # v1.14.0
        with:
          packages-dir: dist/
