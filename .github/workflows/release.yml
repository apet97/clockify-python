name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to recover
        required: true
        type: string
      expected_commit:
        description: Full commit SHA that the tag must resolve to
        required: true
        type: string
      expected_wheel_sha256:
        description: Expected SHA-256 for the wheel
        required: true
        type: string
      expected_sdist_sha256:
        description: Expected SHA-256 for the source distribution
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: 2mcp

env:
  UV_VERSION: "0.11.32"

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_ref: ${{ steps.release.outputs.release_ref }}
      expected_commit: ${{ steps.release.outputs.expected_commit }}
      recovery: ${{ steps.release.outputs.recovery }}
    steps:
      - name: Resolve release inputs
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_REF_NAME: ${{ github.ref_name }}
          EVENT_SHA: ${{ github.sha }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          INPUT_EXPECTED_WHEEL_SHA256: ${{ inputs.expected_wheel_sha256 }}
          INPUT_EXPECTED_SDIST_SHA256: ${{ inputs.expected_sdist_sha256 }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$EVENT_REF" == "refs/heads/main" ]] || {
              echo "Recovery must use the workflow from main." >&2
              exit 1
            }
            release_tag="$INPUT_RELEASE_TAG"
            expected_commit="$INPUT_EXPECTED_COMMIT"
            [[ "$expected_commit" =~ ^[0-9a-f]{40}$ ]] || {
              echo "expected_commit must be a full lowercase commit SHA." >&2
              exit 1
            }
            [[ "$INPUT_EXPECTED_WHEEL_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
              echo "expected_wheel_sha256 must be a lowercase SHA-256 value." >&2
              exit 1
            }
            [[ "$INPUT_EXPECTED_SDIST_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
              echo "expected_sdist_sha256 must be a lowercase SHA-256 value." >&2
              exit 1
            }
            recovery=true
          else
            release_tag="$EVENT_REF_NAME"
            expected_commit="$EVENT_SHA"
            recovery=false
          fi

          [[ "$release_tag" =~ ^v[^/[:space:]]+$ ]] || {
            echo "release_tag must be a v* tag without slashes or whitespace." >&2
            exit 1
          }

          {
            echo "release_tag=$release_tag"
            echo "release_ref=refs/tags/$release_tag"
            echo "expected_commit=$expected_commit"
            echo "recovery=$recovery"
          } >>"$GITHUB_OUTPUT"

  build:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.release_ref }}
          fetch-depth: 0
          path: 2mcp
      - name: Verify release tag, commit, and version
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          EXPECTED_COMMIT: ${{ needs.resolve.outputs.expected_commit }}
        run: |
          set -euo pipefail

          tag_ref="refs/tags/$RELEASE_TAG"
          git show-ref --verify --quiet "$tag_ref" || {
            echo "Release tag was not fetched: $RELEASE_TAG" >&2
            exit 1
          }

          actual_commit="$(git rev-parse HEAD)"
          tag_commit="$(git rev-parse "$tag_ref^{}")"
          [[ "$actual_commit" == "$tag_commit" ]] || {
            echo "Checkout does not match the release tag." >&2
            exit 1
          }
          [[ "$actual_commit" == "$EXPECTED_COMMIT" ]] || {
            echo "Release tag does not match expected_commit." >&2
            exit 1
          }

          package_version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          [[ "$package_version" == "${RELEASE_TAG#v}" ]] || {
            echo "Package version does not match the release tag." >&2
            exit 1
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: apet97/clockify-ts-sdk
          ref: d7091a44a1b95d4918fa17a7f9b174bf668a9136
          path: clockify-ts-sdk
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
      - run: uv sync --locked --all-extras --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest -q -m "not live"
      - run: uv build
      - name: Verify distributions
        env:
          RECOVERY: ${{ needs.resolve.outputs.recovery }}
          EXPECTED_WHEEL_SHA256: ${{ inputs.expected_wheel_sha256 }}
          EXPECTED_SDIST_SHA256: ${{ inputs.expected_sdist_sha256 }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          files=(dist/*)
          [[ ${#wheels[@]} -eq 1 && ${#sdists[@]} -eq 1 && ${#files[@]} -eq 2 ]] || {
            echo "Expected exactly one wheel and one source distribution." >&2
            exit 1
          }

          wheel="${wheels[0]}"
          sdist="${sdists[0]}"
          uv run python scripts/verify_artifact.py \
            --wheel "$wheel" \
            --sdist "$sdist" \
            --python 3.11
          uv run python scripts/verify_artifact.py \
            --wheel "$wheel" \
            --python 3.14

          wheel_sha256="$(sha256sum "$wheel" | cut -d ' ' -f 1)"
          sdist_sha256="$(sha256sum "$sdist" | cut -d ' ' -f 1)"
          printf '%s  %s\n' "$wheel_sha256" "$wheel"
          printf '%s  %s\n' "$sdist_sha256" "$sdist"

          if [[ "$RECOVERY" == "true" ]]; then
            [[ "$wheel_sha256" == "$EXPECTED_WHEEL_SHA256" ]] || {
              echo "Wheel SHA-256 does not match the recovery input." >&2
              exit 1
            }
            [[ "$sdist_sha256" == "$EXPECTED_SDIST_SHA256" ]] || {
              echo "Source distribution SHA-256 does not match the recovery input." >&2
              exit 1
            }
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: 2mcp/dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist
      - name: Require verified distributions
        working-directory: .
        run: |
          set -euo pipefail
          shopt -s nullglob

          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          files=(dist/*)
          [[ ${#wheels[@]} -eq 1 && ${#sdists[@]} -eq 1 && ${#files[@]} -eq 2 ]] || {
            echo "Expected exactly one verified wheel and one verified source distribution." >&2
            exit 1
          }
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: dist/
